name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      ARC_PARENT: ../Arc
      IPA_OUTPUT_DIR: ios/build/robovm
    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Print environment (debug)
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Parent dir: $(dirname \"$GITHUB_WORKSPACE\")"
          ls -la

      - name: Ensure parent dir exists
        run: mkdir -p "$(dirname \"$GITHUB_WORKSPACE\")"

      - name: Clone Arc and get Arc natives
        run: |
          set -euo pipefail
          echo "Cloning Arc into ${ARC_PARENT}"
          git clone --depth=1 https://github.com/Anuken/Arc.git "${ARC_PARENT}"
          cd "${ARC_PARENT}"
          chmod +x ./gradlew || true
          wget https://release-assets.githubusercontent.com/github-production-release-asset/871240177/852d9a31-8d02-4a8f-a5e1-1d73b3e6da74?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-16T22%3A36%3A23Z&rscd=attachment%3B+filename%3Darccoreios.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-16T21%3A35%3A26Z&ske=2026-08-16T22%3A36%3A23Z&sks=b&skv=2018-11-09&sig=kfGHdTmd4ULA%2FkHtml1TYn3hQ9rBrpXuremY5nllep4%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NjkxNjk5OCwibmJmIjoxNzg2OTE2Njk4LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.pVCSP7yjd9rvWH947708mECH76re5Bfe1Ttu5RFedTc&response-content-disposition=attachment%3B%20filename%3Darccoreios.zip&response-content-type=application%2Foctet-stream && unzip arccoreios.zip -d ${ARC_PARENT}/natives/ 
          # ./gradlew build robovm:build
          # echo "Arc build finished. Listing natives:"
          # ls -la natives || true

      - name: Verify Arc natives present (fail early if missing)
        run: |
          if [ ! -f "${ARC_PARENT}/natives/natives-ios/libs/libarc.a" ]; then
            echo "ERROR: expected ${ARC_PARENT}/natives/natives-ios/libs/libarc.a not found"
            exit 1
          fi
          if [ ! -f "${ARC_PARENT}/natives/natives-freetype-ios/libs/libarc-freetype.a" ]; then
            echo "ERROR: expected ${ARC_PARENT}/natives/natives-freetype-ios/libs/libarc-freetype.a not found"
            exit 1
          fi
          echo "Arc natives verified."

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Gradle pack (project)
        run: ./gradlew pack

      - name: Gradle iOS deploy (unsigned)
        run: ./gradlew --stacktrace :ios:deploy -Probovm.iosSkipSigning=true

      - name: List built files
        run: ls -la "${{ env.IPA_OUTPUT_DIR }}" || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios-ipa
          path: ${{ env.IPA_OUTPUT_DIR }}/*.ipa
